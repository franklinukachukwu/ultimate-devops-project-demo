# CI for Product Catalog Service

name: product-catalog-ci

on:
    pull_request:
        branches:
        - main

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        - name: checkout code
          uses: actions/checkout@v4
        - name: Setup Go 1.22
          uses: actions/setup-go@v2
          with:
            go-version: 1.22

        - name: Build
          run: |
            cd src/product-catalog
            go mod download
            go build -o product-catalog-service .

        - name: unit tests
          run: |
            cd src/product-catalog
            go test ./...

    code-quality:
        runs-on: ubuntu-latest
        steps:
        - name: check code
          uses: actions/checkout@v4

        - name: Setup Go 1.22
          uses: actions/setup-go@v2
          with:
            go-version: 1.22

        - name: Run golangci-lint
          run: |
            go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.56.2
            golangci-lint run src/product-catalog/...

    docker:
        runs-on: ubuntu-latest
        
        needs: build

        steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: install Docker
          uses: docker/setup-buildx-action@v1

        - name: Build Docker image
          uses: docker/build-push-action@v6
          with:
            context: src/product-catalog
            file: src/product-catalog/Dockerfile
            push: false
            tags: product-catalog-service:latest

    updatek8s:
        runs-on: ubuntu-latest

        needs: docker

        steps:
        - name: checkout code
          uses: actions/checkout@v4
          with:
            token : ${{ secrets.GITHUB_TOKEN }}

        - name: Update tag in k8s deployment manifest
          run: |
            echo "K8s manifest update would happen here"
            echo "Skipping actual update since we're not pushing to registry"

        - name: Show what would be updated
          run: |
            echo "Would update image tag to: product-catalog-service:${{ github.run_id }}"
