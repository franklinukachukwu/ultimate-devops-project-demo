apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: product-catalog-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/franklinukachukwu/ultimate-devops-project-demo.git
    targetRevision: HEAD
    path: kubernetes/productcatalog
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true